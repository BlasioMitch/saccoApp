# Unit tests, then end-to-end tests against the real backend and gateway (checked out next to this repo)
name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The demo-data script only writes to databases whose name ends in _demo
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finapp_e2e_demo
      SACCOBACK_DIR: ${{ github.workspace }}/saccoback
      GRAPHSACCO_DIR: ${{ github.workspace }}/graphsacco
    steps:
      - uses: actions/checkout@v4
        with:
          path: saccoApp
      # The other two services. If those repos are private, add a SIBLING_REPOS_TOKEN secret (read access).
      - uses: actions/checkout@v4
        with:
          repository: BlasioMitch/saccoback
          path: saccoback
          token: ${{ secrets.SIBLING_REPOS_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: BlasioMitch/graphsacco
          path: graphsacco
          token: ${{ secrets.SIBLING_REPOS_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: saccoback
      - run: npm ci
        working-directory: graphsacco
      - run: npm ci
        working-directory: saccoApp
      - run: npx playwright install --with-deps chromium
        working-directory: saccoApp
      - run: npm run test:e2e
        working-directory: saccoApp
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            saccoApp/playwright-report
            saccoApp/test-results
          retention-days: 7
